name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true

      - name: Vet (CLI / no-GUI)
        run: CGO_ENABLED=0 go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./internal/... .

      - name: Build Linux CLI
        run: bash scripts/build-cli.sh

      - name: Build Windows CLI
        run: bash scripts/build-windows-cli.sh

  build-gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
      # fyne / go-gl/glfw 的 GUI 需要 X11 + OpenGL + Wayland 开发库
      # （本仓库 gui_fyne.go 是 fyne/OpenGL 实现，并非 webkit）
      - name: Install fyne/GLFW build deps (X11/GL/Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config gcc \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev
      - name: Build Linux GUI
        run: bash scripts/build-linux-webview.sh
